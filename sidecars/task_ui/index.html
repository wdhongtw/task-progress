<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Task Progress</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="title-group">
          <svg class="title-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="14" y="3" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="8.5" y="15" width="7" height="6" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M6.5 9V11.5C6.5 12.6046 7.39543 13.5 8.5 13.5H12M17.5 9V11.5C17.5 12.6046 16.6046 13.5 15.5 13.5H12M12 13.5V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <h1 class="app-title">Task Progress</h1>
          <span id="conv-badge" class="conv-badge hidden" title="Active Conversation ID"></span>
          <span id="fork-badge" class="conv-badge fork hidden" title="Inherited from parent forked conversation"></span>
        </div>
        <div class="header-actions">
          <span class="mcp-hint" title="Use task_register, task_update, task_complete, task_delete, task_focus, task_list, task_export_tree MCP tools">
            MCP: <code>task_*</code>
          </span>
          <label class="auto-toggle" title="Auto-refresh every 3 seconds">
            <input type="checkbox" id="chk-live" checked>
            <span class="live-dot" aria-hidden="true"></span>
            <span>Live</span>
          </label>
          <button id="btn-refresh" type="button" class="icon-btn" title="Refresh task DAG now">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.66M13.5 2.5v2.25h-2.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-section">
        <div class="progress-bar-row">
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div id="progress-fill-completed" class="progress-fill completed" style="width: 0%"></div>
            <div id="progress-fill-active" class="progress-fill in-progress" style="width: 0%"></div>
            <div id="progress-fill-pending" class="progress-fill pending" style="width: 0%"></div>
          </div>
          <span id="progress-label" class="progress-label">0 / 0 (0%)</span>
        </div>
      </div>

      <!-- View Switcher & Context Controls -->
      <div class="view-toolbar">
        <div class="view-toolbar-top">
          <div class="view-tabs" role="tablist" aria-label="Visualization mode">
            <button id="tab-graph" type="button" role="tab" aria-selected="true" class="view-tab active" data-view="graph">
              Graph
            </button>
            <button id="tab-list" type="button" role="tab" aria-selected="false" class="view-tab" data-view="list">
              List
            </button>
          </div>
          <div id="status-filter-wrap" class="filter-select-wrap" title="Filter tasks by status">
            <span id="status-filter-dot" class="chip-dot hidden" aria-hidden="true"></span>
            <label for="select-status-filter" class="control-label">Filter:</label>
            <select id="select-status-filter" class="select-box status-filter-select" aria-label="Task status filter">
              <option value="all">All (0)</option>
              <option value="pending">Pending (0)</option>
              <option value="in_progress">In Progress (0)</option>
              <option value="blocked">Blocked (0)</option>
              <option value="completed">Completed (0)</option>
              <option value="cancelled">Cancelled (0)</option>
            </select>
          </div>
        </div>

        <!-- Graph View Controls -->
        <div id="controls-graph" class="sub-toolbar">
          <div class="control-group" title="Limit DAG neighborhood hop radius around the focused task">
            <span class="control-label">Radius:</span>
            <div id="radius-group" class="seg-group">
              <button type="button" class="seg-btn" data-radius="1">1</button>
              <button type="button" class="seg-btn" data-radius="2">2</button>
              <button type="button" class="seg-btn" data-radius="3">3</button>
              <button type="button" class="seg-btn active" data-radius="all">All</button>
            </div>
          </div>
          <div class="control-group" title="DAG layout orientation (Parent Task > Subtask)">
            <span class="control-label">Layout:</span>
            <div id="orient-group" class="seg-group">
              <button type="button" class="seg-btn active" data-orient="TB" title="Top-to-Bottom (A at top, subtasks below)">TB ↓</button>
              <button type="button" class="seg-btn" data-orient="LR" title="Left-to-Right (A on left, subtasks on right)">LR →</button>
            </div>
          </div>
          <div class="control-group zoom-group">
            <button id="btn-zoom-out" type="button" class="ghost-btn xs" title="Zoom out">−</button>
            <button id="btn-zoom-fit" type="button" class="ghost-btn xs" title="Reset zoom and center">Fit</button>
            <button id="btn-zoom-in" type="button" class="ghost-btn xs" title="Zoom in">+</button>
          </div>
          <span id="graph-radius-hint" class="toolbar-hint"></span>
        </div>

        <!-- List View Controls -->
        <div id="controls-list" class="sub-toolbar hidden">
          <input
            id="list-search"
            type="search"
            class="search-input"
            placeholder="Search id, title, description, metadata…"
            autocomplete="off"
          >
          <div class="control-group">
            <label for="select-sort" class="control-label">Sort:</label>
            <select id="select-sort" class="select-box">
              <option value="created">Created Time</option>
              <option value="updated">Updated Time</option>
              <option value="in_degree">In-Degree (Parents waiting)</option>
              <option value="out_degree">Out-Degree (Subtasks required)</option>
              <option value="total_degree">Total Degree (In + Out)</option>
              <option value="status">Status</option>
              <option value="topological">Topological (A &gt; B &gt; D)</option>
              <option value="title">Title (A–Z)</option>
            </select>
            <button id="btn-sort-order" type="button" class="ghost-btn xs" title="Toggle ascending / descending sort order">
              ↑ Asc
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Viewport (Graph / List) -->
    <main class="main-split">
      <section id="viewport-section" class="viewport-section">
        <!-- Graph View Container -->
        <div id="view-graph" class="view-pane">
          <div id="graph-canvas-wrap" class="graph-canvas-wrap">
            <svg id="dag-svg" class="dag-svg" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <div id="graph-empty" class="empty-state hidden"></div>
        </div>

        <!-- List View Container -->
        <div id="view-list" class="view-pane hidden">
          <div id="list-container" class="list-container"></div>
        </div>
      </section>

      <!-- Focused Task Detail Inspector -->
      <aside id="detail-panel" class="detail-panel hidden" aria-label="Focused task details">
        <div class="detail-header">
          <div class="detail-header-left">
            <span class="detail-section-title">Focused Task</span>
            <span id="detail-focused-id" class="code-pill" title="Click to copy task ID"></span>
            <span id="detail-status-badge" class="status-badge"></span>
            <span id="detail-blocked-badge" class="status-badge blocked hidden">BLOCKED</span>
          </div>
          <div class="detail-header-actions">
            <button id="btn-detail-toggle" type="button" class="icon-btn xs" title="Collapse or expand task details">
              ▾
            </button>
          </div>
        </div>
        <div id="detail-body" class="detail-body"></div>
      </aside>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
